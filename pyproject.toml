[project]
name = "canvasgrade"
version = "0.1.0"
description = "Independent assignment, repository analysis, and grading platform"
requires-python = ">=3.10,<3.13"
dependencies = [
    "bcrypt==5.0.0",
    "argon2-cffi==23.1.0",
    "fastapi==0.115.8",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.37",
    "alembic==1.15.1",
    "asyncpg==0.30.0",
    "boto3>=1.35",
    "psycopg[binary]==3.2.9",
    "cryptography==44.0.0",
    "openpyxl==3.1.5",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "pyjwt==2.14.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
exclude = ["backend/migrations/versions"]
# CI and scripts\check-local.ps1 run `ruff check backend` over the whole tree.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length — this codebase's existing style favors dense one-liners
#   in places; not worth a mass reformat mid-refactor.
# B008: flags `Depends(...)` used as an argument default — that is FastAPI's
#   own documented dependency-injection pattern, used in every route in this
#   codebase. Not a real bug for this framework.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["backend"]
mypy_path = "backend"
explicit_package_bases = true
exclude = ["backend/migrations/"]
plugins = ["pydantic.mypy"]
# Without the pydantic plugin, mypy treats BaseSettings like a normal
# pydantic model and demands every no-default field (secret_key,
# database_url) be passed to Settings(...) explicitly — even though
# pydantic-settings populates them from the environment at runtime, which is
# the entire point of the class. The plugin teaches mypy that.

# Baseline: the whole backend is type-checked. These modules still carry pre-existing
# errors (mostly Optional values used right after a lookup). They are listed so that
# every other file, and every new file, is checked strictly; remove a module from
# this list once it is clean. Do not add to it.
[[tool.mypy.overrides]]
module = [
    "models.settings_store",
    "routes_fastapi.admin.batches",
    "routes_fastapi.admin.courses",
    "routes_fastapi.admin.jobs",
    "routes_fastapi.admin.sections",
    "routes_fastapi.admin.subjects",
    "routes_fastapi.admin.users",
    "routes_fastapi.assignments.admin",
    "routes_fastapi.assignments.common",
    "routes_fastapi.assignments.crud",
    "routes_fastapi.assignments.discussions",
    "routes_fastapi.assignments.external_ai",
    "routes_fastapi.assignments.grading",
    "routes_fastapi.assignments.payloads",
    "routes_fastapi.assignments.workflow",
    "seed_academic_data",
    "services.auth_service",
    "services.github_repository_service",
    "services.rate_limiter",
    "services.session_rollover",
    "worker.periodic",
    "tests.test_authorization_matrix",
]
ignore_errors = true
