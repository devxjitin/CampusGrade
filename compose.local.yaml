# Overlay used by scripts\dev-local.ps1 (native API/worker/web on the host, Postgres in Docker).
#
# The `backend` network is internal, and Docker silently ignores published ports for containers
# that are only on an internal network. Attaching Postgres to a second, ordinary network makes the
# 127.0.0.1:5433 mapping from compose.dev.yaml reachable from the host. It is the same container
# and the same data volume as the Docker dev stack.
#
#   docker compose -f compose.yaml -f compose.dev.yaml -f compose.local.yaml up -d postgres
services:
  postgres:
    networks: [backend, hostaccess]

networks:
  hostaccess: {}
