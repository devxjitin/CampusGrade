# Local development overlay.
#   scripts\init-secrets.ps1                       (once)
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Hot reload for backend and frontend, services published on localhost for
# debugging, no HTTPS proxy. App: http://localhost:3000  API: http://localhost:5001
x-api-dev-env: &api-dev-env
  APP_ENV: development
  COOKIE_SECURE: "false"
  ALLOWED_ORIGINS: http://localhost:3000

services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  storage-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: campusgrade-api:local
    environment:
      <<: *api-dev-env

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: campusgrade-api:local
    environment:
      <<: *api-dev-env

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: campusgrade-api:local
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5001", "--reload"]
    environment:
      <<: *api-dev-env
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:5001:5001"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: campusgrade-api:local
    environment:
      <<: *api-dev-env
    volumes:
      - ./backend:/app

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    environment:
      NODE_ENV: development
      BACKEND_ORIGIN: http://api:5001
      # Empty: in dev the proxy calls the same-origin /api rewrite instead.
      API_INTERNAL_URL: ""
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      disable: true

  # Not needed in dev: the browser talks to web and api directly.
  proxy:
    profiles: ["prod-only"]

volumes:
  postgres_data:
    name: campusgrade_dev_postgres
  storage_data:
    name: campusgrade_dev_storage
  caddy_data:
    name: campusgrade_dev_caddy
  web_node_modules:
    name: campusgrade_dev_web_node_modules
