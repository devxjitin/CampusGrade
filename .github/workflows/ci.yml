name: CI

# Every pull request is linted, type-checked, tested, built into the real
# production images, scanned, started as the production compose stack and
# exercised with Playwright. Merges to main (and version tags) publish those
# images to GitHub Container Registry, which is what scripts/deploy.ps1 pulls.
#
# Scope note: `ruff` checks an explicit, currently-clean file list (see the
# comment on [tool.ruff] in pyproject.toml), not the whole backend yet.
# Sprint 3 widens it to everything.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: ruff (explicit clean-file list — see pyproject.toml)
        run: uv run ruff check backend/tests/conftest.py backend/tests/test_golden_paths.py backend/tests/test_errors.py backend/tests/test_readiness.py backend/config.py backend/core backend/scripts/ensure_bucket.py backend/gunicorn.conf.py backend/routes_fastapi/notification_routes.py backend/routes_fastapi/user_routes.py backend/routes_fastapi/admin/academic_sessions.py backend/routes_fastapi/admin_settings.py backend/routes_fastapi/admin/users.py backend/services/academic_calendar.py backend/routes_fastapi/admin/courses.py backend/routes_fastapi/admin/batches.py backend/routes_fastapi/admin/sections.py backend/routes_fastapi/admin/subjects.py backend/services/session_rollover.py backend/routes_fastapi/admin/session_rollover.py backend/routes_fastapi/assignment_routes.py backend/services/identity_service.py backend/routes_fastapi/admin/admins.py backend/tests/test_authorization_matrix.py backend/tests/test_program_admin_scoping.py backend/tests/test_security.py backend/tests/test_cookie_auth.py backend/routes_fastapi/auth_routes.py
      - name: mypy (backend/config.py, backend/core, backend/schemas — widened sprint by sprint)
        run: uv run mypy

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: pytest (Docker-backed integration tests use testcontainers)
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-and-not-weak-0123456789
        run: uv run pytest backend/tests --cov=backend --cov-report=term-missing -v

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: upgrade / downgrade / upgrade round-trip
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-and-not-weak-0123456789
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          cd backend
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: unit tests (vitest)
        run: npx vitest run --passWithNoTests
      - name: generated API types are not stale
        run: |
          git diff --exit-code -- src/types/api.d.ts || \
          (echo "::error::src/types/api.d.ts is stale — run 'npm run gen:types' against a running backend and commit the result" && exit 1)

  # Builds the exact images that get published, scans them, starts the
  # production compose stack from them and runs the browser tests against
  # https://campusgrade.localhost.
  stack:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, migrations, frontend]
    env:
      CAMPUSGRADE_VERSION: ci
      CAMPUSGRADE_PULL_POLICY: never
      ADMIN_EMAIL: e2e-admin@campusgrade.dev
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase registry owner
        run: echo "CAMPUSGRADE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: ${{ env.CAMPUSGRADE_REGISTRY }}/campusgrade-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.CAMPUSGRADE_REGISTRY }}/campusgrade-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CAMPUSGRADE_REGISTRY }}/campusgrade-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (web)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CAMPUSGRADE_REGISTRY }}/campusgrade-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate secrets and config
        run: |
          pwsh -File scripts/init-secrets.ps1
          cp .env.prod.example .env.prod

      - name: Start the production stack
        run: docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml up -d --wait

      - name: Smoke test through the HTTPS proxy
        run: |
          for path in /api/ready /login; do
            curl -fsS -k --retry 10 --retry-delay 3 --retry-connrefused \
              --resolve campusgrade.localhost:443:127.0.0.1 \
              "https://campusgrade.localhost${path}" -o /dev/null
            echo "ok ${path}"
          done

      - name: Create the e2e admin
        run: |
          E2E_PASSWORD="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::${E2E_PASSWORD}"
          echo "E2E_SUPER_ADMIN_PASSWORD=${E2E_PASSWORD}" >> "$GITHUB_ENV"
          echo "E2E_SUPER_ADMIN_EMAIL=${ADMIN_EMAIL}" >> "$GITHUB_ENV"
          docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml run --rm -T \
            -e BOOTSTRAP_ADMIN_EMAIL="${ADMIN_EMAIL}" -e BOOTSTRAP_ADMIN_PASSWORD="${E2E_PASSWORD}" \
            api python bootstrap_admin.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright end-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://campusgrade.localhost
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Container logs (on failure)
        if: failure()
        run: docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml down -v

  # Only main and version tags publish. These are the images deploy.ps1 pulls.
  publish:
    runs-on: ubuntu-latest
    needs: [stack]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/campusgrade-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
